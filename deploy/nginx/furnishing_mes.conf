# Furnishing MES — sample reverse-proxy config (Nginx)
#
# Runs on the HOST, not inside the Compose stack (docs/08-deployment-operations.md
# section 4 explains why: TLS certificates and the plant's existing web estate
# stay under the customer's normal administration, outside Docker).
#
# This is a template. Replace <FMES_HOSTNAME> and the certificate paths, then
# drop it in /etc/nginx/sites-available/ and symlink it into sites-enabled/.
#
# A Caddy user gets the same three behaviours (HTTPS by default, reverse proxy,
# websocket upgrade) in about eight lines — Caddy is the lower-effort choice if
# the customer has no existing Nginx estate to stay consistent with.

# ---------------------------------------------------------------- HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name <FMES_HOSTNAME>;
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------ TLS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <FMES_HOSTNAME>;

    ssl_certificate     /etc/letsencrypt/live/<FMES_HOSTNAME>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<FMES_HOSTNAME>/privkey.pem;
    # Or the plant's internal CA-issued pair, if the server is not
    # reachable from the internet for Let's Encrypt's HTTP-01 challenge.

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # XLSX imports (operator allocation, master data) and equipment photo
    # uploads both exceed Nginx's 1M default.
    client_max_body_size 100M;

    # Long report generation (docs/08 section 3 sets Odoo's own
    # limit_time_real to 1200s to match) needs matching proxy headroom.
    proxy_read_timeout 720s;
    proxy_connect_timeout 90s;
    proxy_send_timeout 720s;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 1024;

    # ---------------------------------------------------------------- main app
    location / {
        proxy_pass http://127.0.0.1:8069;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Required for proxy_mode = True (config/odoo.prod.conf.example) to be
        # meaningful — without these headers Odoo trusts its own guess at
        # scheme/host instead of what actually terminated TLS.
    }

    # --------------------------------------------------------- longpolling ---
    # Odoo 18's live updates (dashboards, alert badges, chatter) use a
    # websocket on 8072. Without this block proxied with the Upgrade headers,
    # longpolling silently falls back to nothing — the UI looks fine but never
    # refreshes on its own.
    location /websocket {
        proxy_pass http://127.0.0.1:8072;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # ------------------------------------------------------------- static ----
    # Optional: let Nginx serve web assets directly instead of round-tripping
    # through Odoo's worker pool. Safe to omit — Odoo serves these itself.
    location ~* /web/(static|image|content)/ {
        proxy_pass http://127.0.0.1:8069;
        proxy_set_header Host $host;
        expires 1d;
        add_header Cache-Control "public";
    }
}
