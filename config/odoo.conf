; ============================================================================
;  Furnishing MES — Odoo server configuration (DEVELOPMENT)
; ============================================================================
;  This file is committed and contains NO production secret.
;  Production overrides ship in Phase 15 (docker-compose.prod.yml + a generated,
;  git-ignored prod config). See docs/08-deployment-operations.md.
; ============================================================================

[options]

; ─────────────────────────────────────────────────────────────── addons ─────
; /mnt/extra-addons is the bind mount of ./addons from the host.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; ────────────────────────────────────────────────────────────── database ────
; db_host, db_port, db_user and db_password are injected by the official Odoo
; image entrypoint from the HOST / PORT / USER / PASSWORD environment variables
; set in docker-compose.yml, which in turn read .env. They are deliberately NOT
; written here, so no credential is ever committed.
db_maxconn = 32

; list_db exposes the database manager at /web/database/manager.
;   Development : True  — needed for the first-run database creation wizard.
;                         The stack binds to 127.0.0.1 by default, so this is
;                         reachable only from the developer's own machine.
;   Production  : False — set in the Phase 15 production config.
list_db = True

; dbfilter is left open in development so any database name works.
; Production pins it to the single database (see the deployment doc).
; dbfilter = ^furnishing_mes$

; Master password guarding the database manager.
;   There is no --admin-passwd command-line option in Odoo 18, so this value
;   can only live in a config file. It is an obvious development placeholder,
;   stated explicitly rather than left at Odoo's silent default of "admin".
;   Production generates a strong value into a git-ignored config file.
admin_passwd = fmes_dev_master_change_in_production

; ────────────────────────────────────────────────────────────────── http ────
http_enable = True
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
; proxy_mode is enabled in production, behind the reverse proxy.
proxy_mode = False

; ─────────────────────────────────────────────────────────────── workers ────
; workers = 0 runs Odoo single-process, which is what makes breakpoints and
; interactive debugging work. Production uses (2 x cores) + 1.
workers = 0
; Must be >= 2: the backlog snapshot, carry-forward, preventive-maintenance and
; alert crons all run overnight and would otherwise serialise behind each other.
max_cron_threads = 2

; ──────────────────────────────────────────────────────────────── limits ────
; Only enforced when workers > 0, but kept here so dev and prod stay comparable.
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

; ─────────────────────────────────────────────────────────────── logging ────
; No logfile: everything goes to stdout, so `docker compose logs -f web` works.
log_level = info
; Verbose output for our module only, keeping the rest of the log readable.
log_handler = odoo.addons.furnishing_mes:DEBUG

; ──────────────────────────────────────────────────────────────── locale ────
; Assumption A47 — see docs/15-open-questions-and-assumptions.md
; The timezone is set per user/company in Odoo; this is the server default.
; server_wide_modules is left at the Odoo default (base,web).
